name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Checkout rules (Finance)
        env:
          FINANCE_RULES: ${{ secrets.FINANCE_RULES }}
        run: |
          if [ -z "$FINANCE_RULES" ]; then
            echo "::error::FINANCE_RULES secret is not available to this run"
            exit 1
          fi
          trap 'rm -rf rules vitest.rules.config.ts' EXIT
          printf '%s' "$FINANCE_RULES" | base64 -d | tar -xzf -
          npx vitest run --config vitest.rules.config.ts

  # Reviews only code that already passes tests and Finance's checkout rules,
  # so a red pull request gets no review until it is fixed.
  droid-review:
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: droid-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_depth: deep
          allowed_bots: factory-droid
