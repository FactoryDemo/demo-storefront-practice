name: DAST

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the app
        run: |
          npm run start > "$RUNNER_TEMP/next.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/next.log"
          exit 1
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          fail_action: false
          allow_issue_writing: false
